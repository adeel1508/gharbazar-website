<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login & Sign Up - GharBazar</title>
  <meta name="description" content="Log in or sign up to your GharBazar account to track your orders and shop faster with saved addresses.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">GB</div>
        <div>
          <div class="brand-title">GharBazar</div>
          <div class="brand-subtitle">Pakistan Boutique</div>
        </div>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.9rem;">← Back to Store</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main style="display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 40px 20px;">
    <div class="card" style="max-width: 460px; width: 100%;">
      
      <!-- Tab Controls -->
      <div style="display: flex; border-bottom: 2px solid var(--outline-variant); margin-bottom: 24px;">
        <button id="tab-login" class="auth-tab active" style="flex: 1; padding: 12px; font-weight: 700; border: none; background: none; cursor: pointer; border-bottom: 3px solid var(--primary); color: var(--primary); font-size: 1rem;">
          Log In
        </button>
        <button id="tab-signup" class="auth-tab" style="flex: 1; padding: 12px; font-weight: 700; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; color: var(--on-surface-variant); font-size: 1rem;">
          Create Account
        </button>
      </div>

      <!-- Alert Message Box -->
      <div id="auth-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem; font-weight: 500;"></div>

      <!-- Login Form -->
      <form id="login-form" style="display: block;" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address *</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. user@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password *</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px;">
          Log In
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display: none;" novalidate>
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Muhammad Ali" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number *</label>
          <input type="tel" id="signup-phone" class="form-input" placeholder="e.g. 03001234567" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-input" placeholder="e.g. user@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password *</label>
          <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" required minlength="6">
        </div>

        <button type="submit" id="btn-signup-submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <!-- Google Sign-In Section -->
      <div style="display: flex; align-items: center; margin: 24px 0;">
        <div style="flex: 1; border-bottom: 1px solid var(--outline-variant);"></div>
        <span style="padding: 0 12px; font-size: 0.85rem; color: var(--on-surface-variant); font-weight: 600;">OR</span>
        <div style="flex: 1; border-bottom: 1px solid var(--outline-variant);"></div>
      </div>

      <button id="google-auth-btn" class="btn-secondary" style="width: 100%; padding: 12px; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google
      </button>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 GharBazar E-Commerce • Cash on Delivery Across Pakistan</p>
  </footer>

  <script type="module">
    import { onAuth, logInWithEmail, signUpWithEmail, logInWithGoogle, formatAuthError } from './js/app.js';

    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect') || 'index.html';

    const alertBox = document.getElementById('auth-alert');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    function showAlert(msg, isSuccess = false) {
      alertBox.style.display = 'block';
      alertBox.style.background = isSuccess ? 'var(--success-container)' : '#FCE8E6';
      alertBox.style.color = isSuccess ? 'var(--success)' : 'var(--error)';
      alertBox.style.border = isSuccess ? '1px solid var(--success)' : '1px solid var(--error)';
      alertBox.textContent = msg;
    }

    function clearAlert() {
      alertBox.style.display = 'none';
    }

    onAuth((user) => {
      if (user) {
        window.location.href = redirectTarget;
      }
    });

    tabLogin.addEventListener('click', () => {
      clearAlert();
      tabLogin.style.borderBottom = '3px solid var(--primary)';
      tabLogin.style.color = 'var(--primary)';
      tabSignup.style.borderBottom = '3px solid transparent';
      tabSignup.style.color = 'var(--on-surface-variant)';
      loginForm.style.display = 'block';
      signupForm.style.display = 'none';
    });

    tabSignup.addEventListener('click', () => {
      clearAlert();
      tabSignup.style.borderBottom = '3px solid var(--primary)';
      tabSignup.style.color = 'var(--primary)';
      tabLogin.style.borderBottom = '3px solid transparent';
      tabLogin.style.color = 'var(--on-surface-variant)';
      signupForm.style.display = 'block';
      loginForm.style.display = 'none';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showAlert("Please fill in both email and password.");
        return;
      }

      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await logInWithEmail(email, password);
        showAlert("Logged in successfully! Redirecting...", true);
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 500);
      } catch (err) {
        showAlert(formatAuthError(err));
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const name = document.getElementById('signup-name').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;

      if (!name || !phone || !email || !password) {
        showAlert("Please fill in all fields to register.");
        return;
      }

      if (password.length < 6) {
        showAlert("Password must be at least 6 characters long.");
        return;
      }

      const btn = document.getElementById('btn-signup-submit');
      btn.disabled = true;
      btn.textContent = "Creating Account...";

      try {
        await signUpWithEmail(email, password, name, phone);
        showAlert("Account created successfully! Redirecting...", true);
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 500);
      } catch (err) {
        showAlert(formatAuthError(err));
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

    document.getElementById('google-auth-btn').addEventListener('click', async () => {
      clearAlert();
      try {
        await logInWithGoogle();
        showAlert("Signed in with Google! Redirecting...", true);
        setTimeout(() => {
          window.location.href = redirectTarget;
        }, 500);
      } catch (err) {
        showAlert(formatAuthError(err));
      }
    });
  </script>
</body>
</html>
