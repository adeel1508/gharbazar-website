name: E2E tests (Playwright)

# Read-only tests against the LIVE site: no logins, no orders,
# no product changes, no Firestore writes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily live-site check (~11:00 PKT)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for the live site in a real browser
        # curl is NOT enough: after a push, GitHub Pages keeps serving its
        # 404 page to browsers for ~8 minutes even while curl already gets
        # 200 with the real page (seen in E2E runs #1, #3, #4). Readiness
        # must be measured with the same client that runs the tests.
        run: node scripts/wait-for-live-site.mjs

      - name: Run Playwright tests (live site, read-only)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
