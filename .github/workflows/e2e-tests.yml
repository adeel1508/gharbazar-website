name: E2E tests (Playwright)

# Read-only tests against the LIVE site: no logins, no orders,
# no product changes, no Firestore writes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily live-site check (~11:00 PKT)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for the live site to settle after deploy
        # A push triggers the deploy workflow at the same time as this one,
        # and real browsers keep getting GitHub Pages' 404 page for ~8
        # minutes after the deploy reports success (curl can see 200
        # earlier — that is the old deployment still being served). So a
        # single 200 proves nothing: only proceed once the real page is
        # served 3 times in a row, 30s apart.
        run: |
          good=0
          for i in $(seq 1 30); do
            body=$(curl -s https://adeel1508.github.io/gharbazar-website/ || echo "")
            if echo "$body" | grep -q "GharBazar" && ! echo "$body" | grep -q "There isn't a GitHub Pages site here"; then
              good=$((good + 1))
              echo "attempt $i: live site OK ($good/3)"
              if [ "$good" -ge 3 ]; then exit 0; fi
            else
              good=0
              echo "attempt $i: live site not ready yet"
            fi
            sleep 30
          done
          echo "FAIL: live site did not settle within 15 minutes"
          exit 1

      - name: Run Playwright tests (live site, read-only)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
