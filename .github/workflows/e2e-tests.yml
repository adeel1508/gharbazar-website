name: E2E tests (Playwright)

# Read-only tests against the LIVE site: no logins, no orders,
# no product changes, no Firestore writes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily live-site check (~11:00 PKT)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for the live site to respond
        # A push triggers the deploy workflow at the same time as this one,
        # and GitHub Pages briefly returns 404 while the new version
        # publishes. Wait (up to 10 minutes) instead of failing the tests.
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://adeel1508.github.io/gharbazar-website/ || echo 000)
            echo "attempt $i: live site -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "FAIL: live site did not return 200 within 10 minutes"
          exit 1

      - name: Run Playwright tests (live site, read-only)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
