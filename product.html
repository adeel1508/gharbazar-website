<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - GharBazar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">GB</div>
        <div>
          <div class="brand-title">GharBazar</div>
          <div class="brand-subtitle">Pakistan Boutique</div>
        </div>
      </a>
      <div class="nav-actions">
        <button class="cart-btn" id="open-cart-btn">
          <span>🛒 Cart</span>
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div style="margin-bottom: 20px;">
      <a href="index.html" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 6px;">← Back to Shop</a>
    </div>

    <div class="detail-container" id="product-detail-container">
      <div style="text-align: center; padding: 40px;">Loading product details...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 GharBazar E-Commerce • Cash on Delivery Across Pakistan • Live Cloud Sync</p>
  </footer>

  <!-- App Script -->
  <script type="module">
    import { subscribeProducts, formatPkr, getImageSrc, addToCart, updateCartBadge, setupCartDrawer, toggleCartModal, setupHeaderAuth } from './js/app.js';

    let currentProduct = null;
    let selectedQuantity = 1;

    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      setupCartDrawer();
      setupHeaderAuth();
      document.getElementById('open-cart-btn').addEventListener('click', toggleCartModal);

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        window.location.href = 'index.html';
        return;
      }

      subscribeProducts((products) => {
        const product = products.find(p => p.id === productId);
        if (!product) {
          document.getElementById('product-detail-container').innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <h3>Product Not Found</h3>
              <p>The product you are looking for does not exist or has been removed.</p>
              <a href="index.html" class="btn-primary">Return to Shop</a>
            </div>
          `;
          return;
        }

        currentProduct = product;
        renderProductDetail(product);
      });
    });

    // Display label for a stored category value ("BLANKETS" -> "Blankets",
    // "MENS_SUITS" -> "Men's Suits"; any custom value passes through as-is).
    function categoryLabel(value) {
      const v = (value || '').trim();
      if (!v) return 'Blankets';
      if (v.toUpperCase() === 'BLANKETS') return 'Blankets';
      if (v.toUpperCase() === 'MENS_SUITS') return "Men's Suits";
      return v;
    }

    function renderProductDetail(p) {
      const container = document.getElementById('product-detail-container');
      const specs = p.specs || [
        { label: "Category", value: categoryLabel(p.category) },
        { label: "Size / Cutting", value: p.size },
        { label: "Fabric", value: p.fabric }
      ];

      container.innerHTML = `
        <div class="detail-img-wrap">
          <img src="${getImageSrc(p)}" alt="${p.name}" class="detail-img">
        </div>
        <div class="detail-content">
          <span style="font-size: 0.85rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px;">
            ${categoryLabel(p.category)}
          </span>
          <h1 class="detail-title">${p.name}</h1>
          <div class="detail-price">${formatPkr(p.pricePkr)}</div>
          <p class="detail-desc">${p.description || "Premium quality winter essential crafted with superior warmth and refined Pakistani craftsmanship."}</p>
          
          <h4 style="font-size: 1rem; font-weight: 700; margin-top: 8px;">Specifications</h4>
          <table class="specs-table">
            <tbody>
              ${specs.map(s => `
                <tr>
                  <th>${s.label}</th>
                  <td>${s.value}</td>
                </tr>
              `).join('')}
              <tr>
                <th>Stock Status</th>
                <td><span style="color: var(--success); font-weight: 700;">In Stock (${p.stockQuantity || 20} available)</span></td>
              </tr>
            </tbody>
          </table>

          <div class="detail-actions">
            <div class="qty-control">
              <button class="qty-btn" onclick="window.gbChangeQty(-1)">-</button>
              <span class="qty-val" id="qty-display">1</span>
              <button class="qty-btn" onclick="window.gbChangeQty(1)">+</button>
            </div>
            <button class="btn-primary" style="flex: 1; padding: 14px; font-size: 1rem;" onclick="window.gbAddToCartDetail()">
              Add to Cart • <span id="btn-total-price">${formatPkr(p.pricePkr)}</span>
            </button>
          </div>
        </div>
      `;
    }

    window.gbChangeQty = (delta) => {
      selectedQuantity = Math.max(1, selectedQuantity + delta);
      document.getElementById('qty-display').textContent = selectedQuantity;
      if (currentProduct) {
        document.getElementById('btn-total-price').textContent = formatPkr(currentProduct.pricePkr * selectedQuantity);
      }
    };

    window.gbAddToCartDetail = () => {
      if (currentProduct) {
        addToCart(currentProduct, selectedQuantity);
        toggleCartModal();
      }
    };
  </script>
</body>
</html>
