<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - GharBazar</title>
  <meta name="description" content="View product details, price and photos at GharBazar — premium winter blankets and men's suits with Cash on Delivery across Pakistan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">GB</div>
        <div>
          <div class="brand-title">GharBazar</div>
          <div class="brand-subtitle">Pakistan Boutique</div>
        </div>
      </a>
      <div class="nav-actions">
        <button class="cart-btn" id="open-cart-btn">
          <span>🛒 Cart</span>
          <span class="cart-badge" id="cart-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div style="margin-bottom: 20px;">
      <a href="index.html" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 6px;">← Back to Shop</a>
    </div>

    <div class="detail-container" id="product-detail-container">
      <div style="text-align: center; padding: 40px;">Loading product details...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 GharBazar E-Commerce • Cash on Delivery Across Pakistan • Live Cloud Sync</p>
  </footer>

  <!-- App Script -->
  <script type="module">
    import { subscribeProducts, formatPkr, getImageSrc, getGalleryPhotos, addToCart, updateCartBadge, setupCartDrawer, toggleCartModal, setupHeaderAuth } from './js/app.js';

    let currentProduct = null;
    let selectedQuantity = 1;
    let galleryPhotos = [];
    let galleryIndex = 0;

    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      setupCartDrawer();
      setupHeaderAuth();
      document.getElementById('open-cart-btn').addEventListener('click', toggleCartModal);

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        window.location.href = 'index.html';
        return;
      }

      subscribeProducts((products) => {
        const product = products.find(p => p.id === productId);
        if (!product) {
          document.getElementById('product-detail-container').innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <h3>Product Not Found</h3>
              <p>The product you are looking for does not exist or has been removed.</p>
              <a href="index.html" class="btn-primary">Return to Shop</a>
            </div>
          `;
          return;
        }

        currentProduct = product;
        renderProductDetail(product);
      });
    });

    // Display label for a stored category value ("BLANKETS" -> "Blankets",
    // "MENS_SUITS" -> "Men's Suits"; any custom value passes through as-is).
    function categoryLabel(value) {
      const v = (value || '').trim();
      if (!v) return 'Blankets';
      if (v.toUpperCase() === 'BLANKETS') return 'Blankets';
      if (v.toUpperCase() === 'MENS_SUITS') return "Men's Suits";
      return v;
    }

    function renderProductDetail(p) {
      // SEO: unique title + meta description per product (page title was
      // the same generic "Product Details - GharBazar" for every product).
      document.title = `${p.name} - GharBazar`;
      const seoDesc = (p.description || p.shortSpec || `${p.name} - GharBazar`).replace(/\s+/g, ' ').trim().slice(0, 155);
      let metaDesc = document.querySelector('meta[name="description"]');
      if (!metaDesc) {
        metaDesc = document.createElement('meta');
        metaDesc.setAttribute('name', 'description');
        document.head.appendChild(metaDesc);
      }
      metaDesc.setAttribute('content', seoDesc);
      const container = document.getElementById('product-detail-container');
      const photos = getGalleryPhotos(p);
      galleryPhotos = photos;
      galleryIndex = 0;
      const specs = p.specs || [
        { label: "Category", value: categoryLabel(p.category) },
        { label: "Size / Cutting", value: p.size },
        { label: "Fabric", value: p.fabric }
      ];

      container.innerHTML = `
        <div>
          <div class="detail-img-wrap" id="gallery-wrap">
            <img src="${photos[0]}" alt="${p.name}" class="detail-img" id="gallery-main-img">
          </div>
          ${photos.length > 1 ? `
          <div class="gallery-thumbs" id="gallery-thumbs">
            ${photos.map((src, i) => `
              <img src="${src}" alt="${p.name} photo ${i + 1}" class="gallery-thumb${i === 0 ? ' active' : ''}" data-index="${i}" loading="lazy" onclick="window.gbSelectPhoto(${i})">
            `).join('')}
          </div>` : ''}
        </div>
        <div class="detail-content">
          <span style="font-size: 0.85rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px;">
            ${categoryLabel(p.category)}
          </span>
          <h1 class="detail-title">${p.name}</h1>
          <div class="detail-price">${formatPkr(p.pricePkr)}</div>
          <p class="detail-desc">${p.description || "Premium quality winter essential crafted with superior warmth and refined Pakistani craftsmanship."}</p>
          
          <h4 style="font-size: 1rem; font-weight: 700; margin-top: 8px;">Specifications</h4>
          <table class="specs-table">
            <tbody>
              ${specs.map(s => `
                <tr>
                  <th>${s.label}</th>
                  <td>${s.value}</td>
                </tr>
              `).join('')}
              <tr>
                <th>Stock Status</th>
                <td><span style="color: var(--success); font-weight: 700;">In Stock (${p.stockQuantity || 20} available)</span></td>
              </tr>
            </tbody>
          </table>

          <div class="detail-actions">
            <div class="qty-control">
              <button class="qty-btn" onclick="window.gbChangeQty(-1)">-</button>
              <span class="qty-val" id="qty-display">1</span>
              <button class="qty-btn" onclick="window.gbChangeQty(1)">+</button>
            </div>
            <button class="btn-primary" style="flex: 1; padding: 14px; font-size: 1rem;" onclick="window.gbAddToCartDetail()">
              Add to Cart • <span id="btn-total-price">${formatPkr(p.pricePkr)}</span>
            </button>
          </div>
        </div>
      `;
      setupGallerySwipe();
    }

    // Gallery: thumbnail click or horizontal swipe switches the main photo.
    window.gbSelectPhoto = (i) => {
      if (!galleryPhotos.length) return;
      galleryIndex = ((i % galleryPhotos.length) + galleryPhotos.length) % galleryPhotos.length;
      const main = document.getElementById('gallery-main-img');
      if (main) main.src = galleryPhotos[galleryIndex];
      document.querySelectorAll('.gallery-thumb').forEach((t, idx) => {
        t.classList.toggle('active', idx === galleryIndex);
      });
    };

    function setupGallerySwipe() {
      const wrap = document.getElementById('gallery-wrap');
      if (!wrap || galleryPhotos.length < 2) return;
      let startX = null;
      wrap.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      wrap.addEventListener('touchend', (e) => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(dx) > 40) window.gbSelectPhoto(galleryIndex + (dx < 0 ? 1 : -1));
      }, { passive: true });
      // Mouse drag (desktop): same 40px swipe as touch. Mouse events never
      // fire from touch input, so these cannot double-fire with the above.
      let mouseDown = false;
      wrap.addEventListener('mousedown', (e) => { mouseDown = true; startX = e.clientX; e.preventDefault(); });
      wrap.addEventListener('mouseup', (e) => {
        if (!mouseDown || startX === null) return;
        mouseDown = false;
        const dx = e.clientX - startX;
        startX = null;
        if (Math.abs(dx) > 40) window.gbSelectPhoto(galleryIndex + (dx < 0 ? 1 : -1));
      });
      wrap.addEventListener('mouseleave', () => { mouseDown = false; startX = null; });
    }

    window.gbChangeQty = (delta) => {
      selectedQuantity = Math.max(1, selectedQuantity + delta);
      document.getElementById('qty-display').textContent = selectedQuantity;
      if (currentProduct) {
        document.getElementById('btn-total-price').textContent = formatPkr(currentProduct.pricePkr * selectedQuantity);
      }
    };

    window.gbAddToCartDetail = () => {
      if (currentProduct) {
        addToCart(currentProduct, selectedQuantity);
        toggleCartModal();
      }
    };
  </script>
</body>
</html>
